# Template for a newly owned, loopback-only synthetic stack. No linked project.
project_id = "__PROJECT_ID__"

[api]
enabled = true
port = __API_PORT__
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = __DB_PORT__
shadow_port = __SHADOW_PORT__
major_version = 17
health_timeout = "2m"

[db.pooler]
enabled = false

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = __MAIL_PORT__

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[storage.analytics]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = []
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1s"

[auth.rate_limit]
email_sent = 1000
sms_sent = 1
anonymous_users = 1
token_refresh = 1000
sign_in_sign_ups = 1000
token_verifications = 1000
web3 = 1

[edge_runtime]
enabled = false

[analytics]
enabled = false
