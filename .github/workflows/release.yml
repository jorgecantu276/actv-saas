name: ACTV release delivery

on:
  workflow_run:
    workflows: [ACTV candidate verification]
    types: [completed]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source SHA with successful candidate verification
        required: true
        type: string
      ci_run_id:
        description: Exact successful ACTV candidate verification run ID
        required: true
        type: string
      target:
        description: Enrolled release target
        type: choice
        options: [staging, production]
        default: staging
      deploy:
        description: Deploy the prepared release (production also needs W6 approval)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: actv-release-${{ github.event_name == 'workflow_run' && 'staging' || inputs.target }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      eligible: ${{ steps.source.outputs.eligible }}
      source_sha: ${{ steps.source.outputs.source_sha }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      target: ${{ steps.source.outputs.target }}
      deploy: ${{ steps.source.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Select only authenticated exact-source release events
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/releases/select.mjs

  prepare:
    needs: select
    if: needs.select.outputs.eligible == 'true'

    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - name: Validate immutable inputs and successful source run
        shell: bash
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          CI_RUN_ID: ${{ needs.select.outputs.ci_run_id }}
          TARGET: ${{ needs.select.outputs.target }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]] && [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$TARGET" == staging || "$TARGET" == production ]]
          if [[ "$TARGET" == production ]]; then
            [[ "$GITHUB_REF" == refs/heads/main ]]
            git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/source-run.json"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: actv-source-evidence-${{ needs.select.outputs.source_sha }}
          run-id: ${{ needs.select.outputs.ci_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/source-evidence
      - name: Prepare exact source and public target manifest
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          TARGET: ${{ needs.select.outputs.target }}
        run: >-
          node scripts/releases/package.mjs --source-sha "$SOURCE_SHA"
          --target "ops/$TARGET-target.json" --ci-run "$RUNNER_TEMP/source-run.json"
          --ci-evidence "$RUNNER_TEMP/source-evidence/evidence-index.json"
          --output "$RUNNER_TEMP/actv-release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: actv-${{ needs.select.outputs.target }}-release-${{ needs.select.outputs.source_sha }}
          path: ${{ runner.temp }}/actv-release
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  staging:
    if: needs.select.outputs.deploy == 'true' && needs.select.outputs.target == 'staging'
    needs: [select, prepare]
    environment:
      name: actv-staging
      url: https://staging-pdv.actv.mx
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: actv-staging-release-${{ needs.select.outputs.source_sha }}
          path: ${{ runner.temp }}/actv-release
      - name: Deploy forward schema and candidate functions only to synthetic staging
        env:
          SOURCE_SHA: ${{ needs.select.outputs.source_sha }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: >-
          node scripts/releases/staging-backend.mjs --source-sha "$SOURCE_SHA"
          --target ops/staging-target.json --output "$RUNNER_TEMP/backend-receipt.json"
      - name: Install the verified deployment client
        run: bash scripts/releases/install-hostinger.sh
      - name: Deploy and observe the exact staging release
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          ACTV_APP_ENV_JSON: ${{ secrets.ACTV_APP_ENV_JSON }}
        run: >-
          node scripts/releases/hostinger.mjs --package "$RUNNER_TEMP/actv-release"
          --backend-receipt "$RUNNER_TEMP/backend-receipt.json"
          --output "$RUNNER_TEMP/hosting-intent.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actv-staging-deployment-${{ needs.select.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/backend-receipt.json
            ${{ runner.temp }}/hosting-intent.json
            ${{ runner.temp }}/hosting-intent.json.observed.json
          if-no-files-found: warn
          retention-days: 90

  production:
    if: needs.select.outputs.deploy == 'true' && needs.select.outputs.target == 'production' && github.ref == 'refs/heads/main'
    needs: [select, prepare]
    environment:
      name: actv-production
      url: https://pdv.actv.mx
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.select.outputs.source_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.22.2
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: actv-production-release-${{ needs.select.outputs.source_sha }}
          path: ${{ runner.temp }}/actv-release
      - name: Load accepted target-bound release evidence
        env:
          APPROVAL: ${{ secrets.ACTV_W6_APPROVAL_JSON }}
          STAGING_RECEIPT: ${{ secrets.ACTV_STAGING_RECEIPT_JSON }}
          BACKEND_RECEIPT: ${{ secrets.ACTV_BACKEND_RECEIPT_JSON }}
        run: |
          node --input-type=module -e 'import{writeFileSync}from"node:fs";for(const [key,file]of[["APPROVAL","approval"],["STAGING_RECEIPT","staging-receipt"],["BACKEND_RECEIPT","backend-receipt"]]){if(!process.env[key])throw Error("Required acceptance evidence is missing");writeFileSync(process.env.RUNNER_TEMP+"/"+file+".json",JSON.stringify(JSON.parse(process.env[key])))}'
      - name: Enforce full W6 before any production mutation
        run: >-
          node scripts/releases/approve.mjs --manifest "$RUNNER_TEMP/actv-release/release-manifest.json"
          --approval "$RUNNER_TEMP/approval.json" --staging-receipt "$RUNNER_TEMP/staging-receipt.json"
          --staging-target ops/staging-target.json --readiness docs/implementation-readiness.json
      - name: Install the verified deployment client
        run: bash scripts/releases/install-hostinger.sh
      - name: Deploy the accepted compatible application with new sales paused
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          ACTV_APP_ENV_JSON: ${{ secrets.ACTV_APP_ENV_JSON }}
        run: >-
          node scripts/releases/hostinger.mjs --package "$RUNNER_TEMP/actv-release"
          --backend-receipt "$RUNNER_TEMP/backend-receipt.json" --output "$RUNNER_TEMP/hosting-intent.json"
          --approval "$RUNNER_TEMP/approval.json" --staging-receipt "$RUNNER_TEMP/staging-receipt.json"
          --staging-target ops/staging-target.json --readiness docs/implementation-readiness.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: actv-production-deployment-${{ needs.select.outputs.source_sha }}
          path: |
            ${{ runner.temp }}/hosting-intent.json
            ${{ runner.temp }}/hosting-intent.json.observed.json
          if-no-files-found: warn
          retention-days: 90
